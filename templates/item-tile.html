<div class="hud-item-tile {{#if equipped}}is-equipped{{/if}}" draggable="true" tabindex="0"
     data-uuid="{{uuid}}" data-tooltip="{{tooltip}}" data-tooltip-direction="UP" aria-label="{{name}}">
  <img src="{{image}}" alt="{{name}}" loading="lazy">
  <span class="hud-item-count">{{count}}</span>
  <span class="hud-item-name">{{name}}</span>
  <span class="hud-item-weight">{{totalWeight}} kg</span>
  {{#if equipped}}<i class="fa-solid fa-check hud-equipped-mark" aria-hidden="true"></i>{{/if}}
</div>
